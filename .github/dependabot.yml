# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Wait 7 days for other people to find security problems
    # https://daniakash.com/posts/simplest-supply-chain-defense/
    cooldown:
      default-days: 7
    # Majors that break lint: typescript-eslint doesn't support TS 7, and the
    # eslint-plugin-react bundled by eslint-config-next crashes on ESLint 10.
    # Drop each once its dependents support it.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
    # One PR per run instead of many that conflict on the lockfile
    groups:
      npm-dependencies:
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
