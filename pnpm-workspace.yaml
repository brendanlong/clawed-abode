# Single home for pnpm settings (package.json "pnpm" and .npmrc are not used).
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@anthropic-ai/*'
  # Pinned, security-relevant input sanitizer; new releases ship faster than the
  # 7-day quarantine. Pinned to an exact version below so an excluded auto-bump
  # can't slip in silently.
  - 'agent-sanitizer'
  # Exact version named by an advisory (#684); delete once 7 days old
  # (after 2026-10-29 11:39 UTC).
  - 'body-parser@2.4.0'

packages:
  - '.'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
