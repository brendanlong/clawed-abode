minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@anthropic-ai/*'
  # Pinned, security-relevant input sanitizer; new releases ship faster than the
  # 7-day quarantine. Pinned to an exact version below so an excluded auto-bump
  # can't slip in silently.
  - 'agent-sanitizer'

packages:
  - '.'

# Single home for pnpm settings (package.json "pnpm" and .npmrc are not used).
overrides:
  '@typescript-eslint/eslint-plugin': $typescript-eslint
  '@typescript-eslint/parser': $typescript-eslint
  '@typescript-eslint/utils': $typescript-eslint
  '@typescript-eslint/type-utils': $typescript-eslint

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - better-sqlite3
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
