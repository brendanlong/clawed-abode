# Single home for pnpm settings (package.json "pnpm" and .npmrc are not used).
minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@anthropic-ai/*'
  # Pinned, security-relevant input sanitizer; new releases ship faster than the
  # 7-day quarantine. Pinned to an exact version below so an excluded auto-bump
  # can't slip in silently.
  - 'agent-sanitizer'

packages:
  - '.'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
