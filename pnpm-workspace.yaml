# Single home for pnpm settings (package.json "pnpm" and .npmrc are not used).
minimumReleaseAge: 10080
# Fail rather than fall back to a too-new version. At a terminal pnpm instead
# offers to add the version to minimumReleaseAgeExclude: answer no, and add an
# exact-version exclusion by hand only after reviewing the release.
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeExclude:
  - '@anthropic-ai/*'
  # Pinned, security-relevant input sanitizer; new releases ship faster than the
  # 7-day quarantine. Pinned to an exact version below so an excluded auto-bump
  # can't slip in silently.
  - 'agent-sanitizer'

packages:
  - '.'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  better-sqlite3: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  # GHSA-g3hv-75wg-m249: until @typescript-eslint/typescript-estree wants minimatch >=11.0.1
  '@typescript-eslint/typescript-estree>minimatch': ^11.0.1
  # GHSA-jpvv-r467-5p4w, GHSA-qv5m-9pm6-hqp3: until @modelcontextprotocol/sdk wants @hono/node-server >=2.1.6
  '@modelcontextprotocol/sdk>@hono/node-server': ^2.1.6
  # GHSA-46wx-v44x-9hh2, GHSA-4h7h-rv7c-7m2v, GHSA-4m76-xfj5-7975, GHSA-h7mg-cq63-vhpq,
  # GHSA-3gg2-335m-rxc6: until @modelcontextprotocol/sdk wants hono >=4.13.16
  '@modelcontextprotocol/sdk>hono': ^4.13.16
  # parse5-parser-stream 8.1.0 calls parse5 8.1 APIs but declares ^8.0.0: until
  # parse5-parser-stream wants parse5 >=8.1.0 (8.1.1 does)
  'parse5-parser-stream>parse5': ^8.1.0
