# LiteLLM config for proxied models (see "Other model providers" in README.md).
# Each provider is a wildcard entry named "<provider>/*": the app routes models
# with a provider prefix through the proxy and lists them from /v1/models.
model_list:
  # Subscription entries: models the ChatGPT plan includes. An exact name takes
  # precedence over the wildcard below.
  - model_name: 'openai/gpt-6.1-sol'
    model_info: { mode: responses }
    litellm_params: { model: 'chatgpt/gpt-6.1-sol' }
  - model_name: 'openai/gpt-6-luna'
    model_info: { mode: responses }
    litellm_params: { model: 'chatgpt/gpt-6-luna' }
  - model_name: 'openai/gpt-6-astra'
    model_info: { mode: responses }
    litellm_params: { model: 'chatgpt/gpt-6-astra' }
  - model_name: 'openai/*'
    litellm_params:
      model: 'openai/*'
      api_key: os.environ/OPENAI_API_KEY

litellm_settings:
  # Makes Claude Code's requests acceptable to the ChatGPT backend.
  callbacks: litellm_chatgpt_hooks.chatgpt_system_messages
  # Claude Code sends Anthropic-only parameters; drop what the provider rejects.
  drop_params: true
  # List the provider's real models for a wildcard entry instead of "openai/*".
  check_provider_endpoint: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
